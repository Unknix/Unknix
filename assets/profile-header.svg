<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Unknix — Code with intention</title>
<desc id="desc">Japanese-inspired editorial banner: warm ivory typography, a vermilion sun, and gently moving wave lines on an ink-black background.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e8dfce" stroke-opacity=".035"/></pattern>
  <clipPath id="frame"><rect width="1200" height="400" rx="4"/></clipPath>
  <style>
    .sun {animation:breathe 9s ease-in-out infinite;transform-origin:936px 173px}
    .waves {animation:drift 12s ease-in-out infinite alternate}
    .mark {animation:pulse 4s ease-in-out infinite}
    @keyframes breathe {0%,100% {transform:scale(1);opacity:.94} 50% {transform:scale(1.045);opacity:1}}
    @keyframes drift {from {transform:translateX(-14px)} to {transform:translateX(14px)}}
    @keyframes pulse {0%,100% {opacity:.4} 50% {opacity:1}}
    @media (prefers-reduced-motion: reduce) {.sun,.waves,.mark{animation:none}}
  </style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="400" fill="#111415"/>
<rect width="1200" height="400" fill="url(#grid)"/>
<path d="M48 44H1152M48 350H1152" stroke="#e8dfce" stroke-opacity=".22"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#e8dfce">
  <text x="50" y="29" font-size="11" letter-spacing="3">UNKNIX / PERSONAL ARCHIVE</text>
  <text x="1150" y="29" text-anchor="end" font-size="11" letter-spacing="3">CODE · CREATE · EXPLORE</text>
</g>
<circle class="sun" cx="936" cy="173" r="112" fill="#d74735"/>
<circle cx="936" cy="173" r="131" fill="none" stroke="#d74735" stroke-opacity=".35" stroke-width="1"/>
<path d="M936 32V47M936 299V314M794 173H810M1062 173H1078" stroke="#d74735" stroke-opacity=".7"/>
<g class="waves" fill="none" stroke="#e8dfce" stroke-width="1.2" opacity=".25">
<path d="M670 290Q780 225 890 290T1110 290T1330 290"/>
<path d="M650 303Q760 238 870 303T1090 303T1310 303"/>
<path d="M630 316Q740 251 850 316T1070 316T1290 316"/>
<path d="M610 329Q720 264 830 329T1050 329T1270 329"/>
</g>
<rect x="49" y="80" width="3" height="20" fill="#d74735"/>
<text x="65" y="95" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4" fill="#b1afa7">WEB DEVELOPMENT &amp; CREATIVE INTERFACES</text>
<text x="42" y="220" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="112" letter-spacing="-5" fill="#eee7d8">UNKNIX</text>
<text x="50" y="267" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="28" fill="#e8dfce">Code with intention.</text>
<text x="51" y="303" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1" fill="#989b96">Interfaces, experiments, and everything in between.</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#989b96">
<text x="50" y="377">01 / BUILD</text><text x="200" y="377">02 / LEARN</text><text x="350" y="377">03 / REPEAT</text>
<text x="1134" y="377" text-anchor="end">ALWAYS IN PROGRESS</text>
</g>
<circle class="mark" cx="1150" cy="373" r="4" fill="#d74735"/>
</g>
</svg>
